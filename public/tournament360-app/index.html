<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tournament360 · Phase 1</title>
  <link rel="icon" type="image/png" href="/tournament360-favicon.png"/>
  <link rel="apple-touch-icon" href="/tournament360-icon-192.png"/>
  <style>
    :root{--paper:#f5f0e8;--card:#fffaf0;--ink:#1e211d;--muted:#746a5b;--line:#d8ccb7;--navy:#071f46;--gold:#d7ad37;--red:#b91c2a;--blue:#1048b5;--green:#1f8f52;--green2:#19b86a;--warn:#fff1c4;--bad:#ffe1df;--black:#05070c;--white:#f8f6f0}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}
    .app{display:grid;grid-template-columns:250px 1fr;min-height:100dvh}.side{background:var(--navy);color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;gap:11px;align-items:center}.mark{width:50px;height:50px;border-radius:14px;background:#fff7e8;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px rgba(215,173,55,.45)}.mark img{width:100%;height:100%;object-fit:cover}.brand b{font-size:20px}.brand span{display:block;color:#c3cede;font-size:12px}.nav{display:grid;gap:8px}.nav button{border:0;text-align:left;background:transparent;color:#d6deeb;border-radius:12px;padding:11px 12px;font-weight:850}.nav button.on{background:rgba(215,173,55,.18);color:var(--gold)}.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.16);padding-top:14px;color:#b9c6d8;font-size:12px;line-height:1.4}
    .main{padding:24px 30px 34px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.top h1{margin:0;color:var(--navy);font-size:32px;letter-spacing:-.035em}.top p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;background:var(--navy);color:var(--gold);font-weight:950;padding:10px 13px}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}
    .view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 12px 30px rgba(7,31,70,.07)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card h2{margin:0 0 10px;color:var(--navy);font-size:20px}.card p{color:var(--muted);line-height:1.45}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:950}.metric b{display:block;color:var(--navy);font-size:42px;letter-spacing:-.05em;margin-top:6px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e4d8c5;background:#f8f2e7;border-radius:14px;padding:12px;margin-top:9px}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:2px}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950;background:#e3f5e9;color:#1d6a3b;white-space:nowrap}.pill.warn{background:var(--warn);color:#82610d}.pill.bad{background:var(--bad);color:#9f2929}.pill.blue{background:#dbeafe;color:var(--blue)}.pill.red{background:#fee2e2;color:var(--red)}.pill.dark{background:#111827;color:#fff}
    table{width:100%;border-collapse:separate;border-spacing:0 8px}th{text-align:left;color:#756b5b;text-transform:uppercase;letter-spacing:.1em;font-size:10px;padding:0 8px}td{background:#f8f2e7;border-top:1px solid #e4d8c5;border-bottom:1px solid #e4d8c5;padding:10px 8px;font-size:13px}td:first-child{border-left:1px solid #e4d8c5;border-radius:12px 0 0 12px}td:last-child{border-right:1px solid #e4d8c5;border-radius:0 12px 12px 0}.check{width:18px;height:18px;accent-color:var(--navy)}.mini{border:0;border-radius:10px;background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:900;padding:7px 9px}.mini.danger{color:var(--red)}.fee-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.fee-grid .field input{padding:8px}.combo-box{border:1px solid #dfd2bd;background:#f8f2e7;border-radius:14px;padding:11px;margin-top:9px}.combo-box strong{color:var(--navy)}
    .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;color:#8a7350;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;margin-bottom:5px}.field input,.field select{width:100%;background:#f8f2e7;border:1px solid #dfd2bd;border-radius:12px;padding:10px;font-weight:800;color:#2a241c}.field input[type="checkbox"]{width:auto;min-width:22px;height:22px;accent-color:var(--navy)}.upload{border:2px dashed #ceb987;background:#fff9ea;border-radius:16px;padding:18px;display:grid;gap:8px;overflow:hidden}.upload input{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}.file-pick{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--navy);color:var(--gold);font-weight:950;padding:11px 14px;max-width:220px}.file-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}.library-picks{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.library-picks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#f8f2e7;border-radius:999px;padding:9px 12px;font-weight:950;color:var(--navy)}.library-picks input{width:16px;height:16px;accent-color:var(--navy)}
    .phone{max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:32px;padding:14px;margin:auto}.phone-screen{background:#f7f1e6;border-radius:24px;overflow:hidden;min-height:620px}.phone-head{background:var(--navy);color:#fff;padding:17px}.phone-head strong{font-size:22px}.phone-head span{display:block;color:#cdd8ea;font-size:12px}.search{margin:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--muted)}.qr{width:88px;height:88px;border-radius:10px;background:linear-gradient(90deg,#111 10px,transparent 10px 16px,#111 16px 24px,transparent 24px 34px,#111 34px 44px,transparent 44px),linear-gradient(#111 10px,transparent 10px 16px,#111 16px 24px,transparent 24px 34px,#111 34px 44px,transparent 44px),#fff;background-size:44px 44px;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
    .bracket{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:980px}.bracket-wrap{overflow:auto}.bcol{display:grid;gap:10px;align-content:start}.btitle{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#756b5b;font-weight:950}.match{background:#f8f2e7;border:1px solid #ddd0bb;border-radius:16px;overflow:hidden}.match.current{outline:5px solid var(--gold)}.match.available{outline:4px solid var(--green2)}.fighter{display:grid;grid-template-columns:64px 1fr;align-items:center;border-bottom:1px solid #e1d6c4}.fighter:last-child{border-bottom:0}.corner{height:68px;display:grid;place-items:center;color:#fff;font-weight:1000}.corner.ao{background:var(--blue)}.corner.aka{background:var(--red)}.corner.shiro{background:var(--white);color:#111;border-right:1px solid var(--line)}.fname{padding:10px;font-weight:900}.fname small{display:block;color:var(--muted);font-weight:650;margin-top:2px}.start{width:100%;border:0;background:var(--navy);color:var(--gold);padding:11px;font-weight:950}.donebar{display:grid;grid-template-columns:1fr 1fr}.donebar button{border:0;padding:10px;font-weight:950}.donebar button:first-child{background:#e8f6ed;color:var(--green)}.donebar button:last-child{background:#fee2e2;color:var(--red)}
    .score-screen{background:var(--black);min-height:calc(100dvh - 48px);display:grid;grid-template-columns:1fr 220px 1fr;position:relative}.score-side{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:24px;color:#fff}.score-side.ao{background:var(--blue)}.score-side.aka{background:var(--red)}.score-side.shiro{background:var(--white);color:#111}.score-label{font-size:34px;font-weight:1000}.person{text-align:center;align-self:center}.avatar{width:140px;height:140px;border-radius:50%;background:#d8e7ff;color:var(--navy);display:grid;place-items:center;font-size:46px;font-weight:1000;margin:0 auto 10px;border:4px solid #fff}.avatar.red{background:#ffd8d8}.flag{font-size:24px}.person h2{font-size:40px;color:inherit;margin:8px 0}.person p{color:inherit;opacity:.78;font-size:20px}.points{font-size:150px;line-height:.85;font-weight:1000;margin-top:30px}.score-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score-btns button{border:0;border-radius:14px;background:rgba(255,255,255,.2);color:inherit;padding:16px 8px;font-weight:950}.timer{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:560px;max-width:42vw;border-radius:32px;text-align:center;border:6px solid var(--gold);background:var(--warn);color:var(--navy);padding:8px 18px;z-index:4}.timer b{display:block;font-size:132px;line-height:.92}.timer small{display:block;font-weight:950}.timer.critical{background:#fff;color:var(--red);border-color:#fff}.score-mid{background:#05070c}
    .tv{background:#05070c;color:#fff;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.tv-head{background:var(--navy);border-bottom:6px solid var(--gold);padding:22px 34px;display:flex;justify-content:space-between}.tv-head strong{font-size:44px}.tv-head span{font-size:24px;color:#d9e2f1}.tv .bracket{min-width:1120px;padding:32px}.tv .btitle{color:#f0d47a;font-size:16px}.tv .match{background:#101827;border-color:#2f3b50}.tv .fname{color:#fff;font-size:22px}.tv .fname small{color:#b7c1d0;font-size:14px}.tv-foot{background:#fffaf0;color:var(--navy);padding:14px 34px;display:flex;justify-content:space-between;font-size:24px;font-weight:1000}.nextbar{display:flex;gap:14px}.nextbox{padding:8px 18px;color:#fff;font-weight:1000}.nextbox.ao{background:var(--blue)}.nextbox.aka{background:var(--red)}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(2,1fr)}.span3,.span4,.span5,.span6,.span7,.span8,.span12{grid-column:span 12}.fields{grid-template-columns:1fr}.score-screen{grid-template-columns:1fr}.score-mid{display:none}.timer{position:static;transform:none;max-width:none;width:auto;margin:12px}.tv-head,.tv-foot{display:block}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const assetBase=location.protocol==="file:"?"":"/";
    const tournamentLogo=`${assetBase}tournament360-logo.png`;
    const tournamentActivationFee={label:"$150.00 one time",paymentUrl:"https://buy.stripe.com/4gM14mcK74TC3BcfmRao80f"};
    const divisions=[];
    let state={view:location.hash.slice(1)||"dashboard",events:[],selectedEventId:"",eventName:"",eventDate:"",sanctionId:"",divisions,librarySelections:{},lookups:{eventTypes:[],eventStatuses:[],rulesets:[],sanctioningOrganizations:[],sourceSystems:[],divisionLibraries:[],divisionTemplates:[]},importsByEvent:{},importHistoryByEvent:{},fileName:"No file selected",lastImport:null,clock:"0:00",critical:false,eventType:"",eventFeeModel:"",ruleset:"",sanctionedEvent:false,sanctioningBody:"",importSource:"",combineFrom:"",combineTo:"",feeLadder:[],combined:[]};
    const nav=["dashboard","setup","checkin","staging","bracket","scoring","audience-bracket","audience-score","system-admin"];
    const labels={"dashboard":"Dashboard","setup":"Event Setup","import":"CSV Import","checkin":"QR Check-in","staging":"Staging","bracket":"Ring Bracket","scoring":"Scoring","audience-bracket":"Audience Bracket","audience-score":"Audience Score","system-admin":"System Admin"};
    const root=document.getElementById("root");
    const pill=(s,k="ok")=>`<span class="pill ${k}">${s}</span>`;
    const emptyState=(title,body)=>`<div class="row" style="display:block"><strong>${title}</strong><small>${body}</small></div>`;
    function shell(title,sub,content,actions=""){
      root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="mark"><img src="${tournamentLogo}" alt="Tournament360 logo"/></div><div><b>Tournament360</b><span>Phase 1 build</span></div></div><div class="nav">${nav.map(v=>`<button class="${state.view===v?'on':''}" data-nav="${v}">${labels[v]}</button>`).join("")}</div><div class="side-foot">No event loaded yet.<br/><br/>Local prototype mode. No live data writes yet.</div></aside><main class="main"><div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>${content}</main></div>`;
      document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
    }
    function go(v){state.view=v;history.replaceState(null,"","#"+v);render()}
    function metric(a,b,c){return `<section class="card metric span3"><span>${a}</span><b>${b}</b><p>${c}</p></section>`}
    function row(a,b,c,k="ok"){return `<div class="row"><div><strong>${a}</strong><small>${b}</small></div>${pill(c,k)}</div>`}
    function activationLabel(){return tournamentActivationFee.label}
    function activationButton(){return `<button class="btn gold" id="activateEvent" type="button">Activate event — ${clean(activationLabel())}</button>`}
    function openActivationPayment(){window.open(tournamentActivationFee.paymentUrl,"_blank","noopener")}
    function selectedEvent(){return state.events.find(e=>e.id===state.selectedEventId)||null}
    function currentImports(){return state.importsByEvent[state.selectedEventId]||[]}
    function currentImportHistory(){return state.importHistoryByEvent[state.selectedEventId]||[]}
    function clean(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
    function eventSelect(){return `<div class="field" style="min-width:280px"><label>Selected event</label><select id="selectedEvent"><option value="">No event selected</option>${state.events.map(e=>`<option value="${e.id}" ${e.id===state.selectedEventId?"selected":""}>${clean(e.name)}</option>`).join("")}</select></div>`}
    function chooseEvent(id){state.selectedEventId=id;const ev=selectedEvent();if(ev){state.eventName=ev.name;state.eventDate=ev.date||"";state.eventType=ev.type||"";state.eventFeeModel=ev.feeModel||"";state.sanctionedEvent=!!ev.sanctioned;state.sanctioningBody=ev.sanctioningBody||"";state.sanctionId=ev.sanctionId||"";state.fileName=ev.lastFileName||"No file selected";state.lastImport=ev.lastImport||null}render()}
    function openEvent(id){chooseEvent(id);go("setup")}
    function newEventDraft(){state.selectedEventId="";state.eventName="";state.eventDate="";state.eventType="";state.eventFeeModel="";state.sanctionedEvent=false;state.sanctioningBody="";state.sanctionId="";state.fileName="No file selected";state.lastImport=null;go("setup")}
    function eventRows(){return state.events.map(e=>`<tr><td><b>${clean(e.name)}</b></td><td>${clean(e.type)}</td><td>${clean(e.date||"—")}</td><td>${pill(clean(e.status||"Draft"),e.status==="Live"?"ok":"warn")}</td><td><button class="mini" onclick="openEvent('${e.id}')">Open</button></td></tr>`).join("")||`<tr><td colspan="5">No prior events are attached to this dojo yet.</td></tr>`}
    function dashboard(){const event=selectedEvent();shell("Tournament360 dashboard","Select an event to view registrations, check-ins, staging, rings, and result approvals.",`<div class="grid"><section class="card span12"><div class="row" style="margin-top:0"><div><strong>Event workspace</strong><small>Each event type can be managed separately under the dojo account. Event types come from lookup tables.</small></div>${eventSelect()}</div></section>${metric("Registrations",event?.registrations||"0",event?"For selected event":"Select an event first")}${metric("Checked in",event?.checkedIn||"0",event?"For selected event":"Select an event first")}${metric("Staged",event?.staged||"0",event?"For selected event":"Select an event first")}${metric("Rings live",event?.rings||"0",event?"For selected event":"Select an event first")}<section class="card span7"><h2>Previous / current events</h2><p>Dojos can return to old events from this table. Nothing is deleted just because an event weekend is over.</p><table><thead><tr><th>Event</th><th>Type</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${eventRows()}</tbody></table></section><section class="card span5"><h2>Add new event</h2><p>Each new Tournament360 event requires activation before registration, imports, staging, or scoring can go live.</p>${row("Activation fee","Required once per new event",activationLabel(),"warn")}${row("Draft setup","Allowed before activation","Available","ok")}<button class="btn gold" style="width:100%;margin-top:14px" onclick="newEventDraft()">Create event draft →</button></section><section class="card span7"><h2>Division readiness</h2>${emptyState("No selected event division data yet.","Upload registration data or add divisions after selecting an event.")}</section><section class="card span5"><h2>Pending admin approval</h2>${emptyState("No ring results pending approval.","Completed divisions will appear here after ring operators submit final results.")}</section></div>`);const picker=document.getElementById("selectedEvent");if(picker)picker.onchange=e=>chooseEvent(e.target.value)}
    function setup(){
      shell("Event setup","Create or select an event first, then attach imports, fees, rules, tickets, and divisions to that event.",`<div class="grid"><section class="card span8"><h2>Event settings</h2><div class="fields">${field("Event name",state.eventName)}${field("Event type",state.eventType,"eventType")}${field("Ruleset",state.ruleset,"select")}${field("Competition date",state.eventDate,"date")}${field("Sanctioned event",state.sanctionedEvent,"sanctioned")}${field("Sanctioning organization",state.sanctioningBody,"sanctionBody")}${field("Sanction / event ID",state.sanctionId)}${field("Registration service fee","","currency")}${field("SMS fee","","currency")}${field("Spectator ticket","","currency")}${field("Late fee","","currency")}${field("Late fee assessed on","","date")}${field("Bracket warning","Warn if fewer than 3")}</div><div class="row"><div><strong>New event activation</strong><small>Event can be drafted first. Going live requires the per-event Tournament360 activation payment.</small></div>${pill(activationLabel(),"warn")}</div><div class="actions" style="margin-top:12px"><button class="btn gold" id="saveEvent">Save event draft before import</button>${activationButton()}</div></section>${eventFeePanel()}${setupImportPanel()}<section class="card span12"><h2>Combine divisions</h2><p>When a division is too small, combine it into another division before bracket generation. Tournament360 keeps the original registration division for audit/export.</p><div class="fields"><div class="field"><label>Move athletes from</label>${divisionSelect("combineFrom",state.combineFrom)}</div><div class="field"><label>Combine into</label>${divisionSelect("combineTo",state.combineTo)}</div><div class="field"><label>Reason / note</label><input id="combineNote" value=""/></div></div><button class="btn" id="combineBtn" style="margin-top:12px">Combine selected divisions</button><div id="combinedList">${combinedList()}</div></section><section class="card span12"><h2>Division library selection</h2><p>Select the division libraries for this event. Tournament360 loads matching templates automatically, then you can check or uncheck individual divisions.</p>${divisionLibraryControls()}${divisionTable()}</section></div>`);
      document.querySelectorAll("[data-div]").forEach(c=>c.onchange=e=>{const d=state.divisions.find(x=>x.id===e.target.dataset.div);if(d)d.included=e.target.checked;render()});
      const eventName=document.getElementById("Event name");if(eventName)eventName.oninput=e=>state.eventName=e.target.value;
      const eventDate=document.getElementById("Competition date");if(eventDate)eventDate.onchange=e=>state.eventDate=e.target.value;
      const eventType=document.getElementById("Event type");if(eventType)eventType.onchange=e=>{state.eventType=e.target.value;const row=state.lookups.eventTypes.find(x=>x.value===e.target.value);state.eventFeeModel=row?.feeModel||"";render()};
      const rules=document.getElementById("Ruleset");if(rules)rules.onchange=e=>{state.ruleset=e.target.value;render()};
      const sanctioned=document.getElementById("Sanctioned event");if(sanctioned)sanctioned.onchange=e=>{state.sanctionedEvent=e.target.checked;render()};
      const sanctionBody=document.getElementById("Sanctioning organization");if(sanctionBody)sanctionBody.onchange=e=>{state.sanctioningBody=e.target.value;render()};
      const sanctionId=document.getElementById("Sanction / event ID");if(sanctionId)sanctionId.oninput=e=>state.sanctionId=e.target.value;
      document.querySelectorAll("[data-lib]").forEach(c=>c.onchange=e=>{state.librarySelections[e.target.dataset.lib]=e.target.checked;refreshDivisionsFromLibraries()});
      const saveEvent=document.getElementById("saveEvent");if(saveEvent)saveEvent.onclick=saveEventDraft;const activateEvent=document.getElementById("activateEvent");if(activateEvent)activateEvent.onclick=openActivationPayment;
      const csv=document.getElementById("csv");if(csv)csv.onchange=readCsv;
      const importSource=document.getElementById("importSource");if(importSource)importSource.onchange=e=>{state.importSource=e.target.value;render()};
      bindFeeEditor();
      bindCurrencyFields();
      const from=document.getElementById("combineFrom"),to=document.getElementById("combineTo");
      if(from)from.onchange=e=>state.combineFrom=e.target.value;
      if(to)to.onchange=e=>state.combineTo=e.target.value;
      const addCombo=document.getElementById("combineBtn");if(addCombo)addCombo.onclick=()=>{const f=state.divisions.find(d=>d.id===state.combineFrom),t=state.divisions.find(d=>d.id===state.combineTo);if(!f||!t||f.id===t.id)return;state.combined.unshift({from:`${f.id} · ${f.name}`,to:`${t.id} · ${t.name}`,note:document.getElementById("combineNote").value||"Director approved"});render()};
    }
    function eventFeePanel(){if(state.eventFeeModel==="ladder")return `<section class="card span4"><h2>Entry fee ladder</h2><p>This appears when the selected event type lookup row is configured for ladder pricing.</p>${feeLadderEditor()}<button class="btn gold" id="addFee" style="width:100%;margin-top:10px">Add fee step</button></section>`;if(state.eventFeeModel==="single")return `<section class="card span4"><h2>Single event fee</h2><p>This appears when the selected event type lookup row is configured for single-fee pricing.</p>${field("Registration fee","","currency")}<div class="field" style="margin-top:10px"><label>Capacity / seats</label><input value=""/></div><div class="field" style="margin-top:10px"><label>Credential or wristband type</label><input value=""/></div></section>`;return `<section class="card span4"><h2>Fee model</h2>${emptyState("Select an event type from lookup tables.","The event type table should define whether this event uses ladder pricing, single-fee pricing, tickets, or another fee model.")}</section>`}
    function setupImportPanel(){const event=selectedEvent(),imports=currentImports(),history=currentImportHistory(),last=state.lastImport;return `<section class="card span12"><h2>Attach CSV imports to event</h2><p>Upload as many CSVs as needed. Tournament360 appends only new event records and leaves existing records untouched.</p><div class="row"><div><strong>${event?clean(event.name):"No event selected"}</strong><small>${event?"Uploads attach to this selected event only.":"Save an event draft or select an old event before uploading from another system."}</small></div>${pill(event?"Ready for upload":"Create event first",event?"ok":"warn")}</div><div class="fields" style="margin-top:12px"><div class="field"><label>Source system</label><select id="importSource" ${event?"":"disabled"}>${lookupOptions("sourceSystems",state.importSource,"No source systems loaded")}</select></div><div class="field"><label>Upload .CSV file</label><label class="file-pick">Choose CSV file<input type="file" id="csv" accept=".csv,text/csv" ${event?"":"disabled"}/></label></div><div class="field"><label>Last uploaded file</label><input value="${clean(state.fileName)}" disabled/></div></div>${last?`<div class="row"><div><strong>Last upload result</strong><small>${clean(last.file)} · ${clean(last.source)} · ${last.total} rows read</small></div><div style="display:flex;gap:6px;flex-wrap:wrap">${pill(`${last.added} new`,"ok")}${pill(`${last.duplicates} duplicate skipped`,last.duplicates?"warn":"ok")}</div></div>`:""}<div class="grid" style="margin-top:12px">${metric("Attached records",imports.length,"For selected event")}${metric("Clean",imports.filter(r=>r.kind==='ok').length,"Ready")}${metric("Warnings",imports.filter(r=>r.kind==='warn').length,"Review")}${metric("Blocked",imports.filter(r=>r.kind==='bad').length,"Fix first")}</div><h2 style="margin-top:14px">Upload history</h2>${importHistoryTable(history)}<h2 style="margin-top:14px">Validation queue</h2>${importTable(imports)}</section>`}
    function saveEventDraft(){const name=(document.getElementById("Event name")?.value||"").trim();if(!name)return;const id=state.selectedEventId||`event-${Date.now()}`;const existing=state.events.find(e=>e.id===id);const imports=state.importsByEvent[id]||[];const event={id,name,type:state.eventType,feeModel:state.eventFeeModel,date:state.eventDate,sanctioned:state.sanctionedEvent,sanctioningBody:state.sanctioningBody,sanctionId:state.sanctionId,status:"Draft",registrations:String(imports.length||0),checkedIn:existing?.checkedIn||"0",staged:existing?.staged||"0",rings:existing?.rings||"0",lastFileName:existing?.lastFileName||"No file selected",lastImport:existing?.lastImport||null};if(existing)Object.assign(existing,event);else state.events.unshift(event);state.selectedEventId=id;state.eventName=name;state.fileName=event.lastFileName;state.lastImport=event.lastImport;render()}
    function lookupOptions(table,value,emptyLabel){const rows=state.lookups[table]||[];return rows.length?`<option value="">Select from lookup table</option>${rows.map(r=>`<option value="${clean(r.value)}" ${value===r.value?"selected":""}>${clean(r.label||r.value)}</option>`).join("")}`:`<option value="">${emptyLabel}</option>`}
    function field(label,value,type="input"){return `<div class="field"><label for="${label}">${label}</label>${type==="select"?`<select id="${label}">${lookupOptions("rulesets",value,"No rulesets loaded")}</select>`:type==="eventType"?`<select id="${label}">${lookupOptions("eventTypes",value,"No event types loaded")}</select>`:type==="sanctioned"?`<input id="${label}" type="checkbox" ${state.sanctionedEvent?"checked":""}/>`:type==="sanctionBody"?`<select id="${label}" ${state.sanctionedEvent?"":"disabled"}>${lookupOptions("sanctioningOrganizations",value,"No sanctioning organizations loaded")}</select>`:type==="date"?`<input id="${label}" type="date" value="${value}"/>`:type==="currency"?`<input id="${label}" data-currency="true" inputmode="decimal" placeholder="$0.00" value="${value}"/>`:`<input id="${label}" value="${value}"/>`}</div>`}
    function divisionSelect(id,value){const options=state.divisions;return `<select id="${id}"><option value="">No divisions loaded</option>${options.map(d=>`<option value="${clean(d.id)}" ${d.id===value?"selected":""}>${clean(d.id)} · ${clean(d.name)}</option>`).join("")}</select>`}
    function combinedList(){return state.combined.map((c,i)=>`<div class="combo-box"><strong>${c.from}</strong> → <strong>${c.to}</strong><br/><small>${c.note}</small> <button class="mini danger" style="float:right" onclick="state.combined.splice(${i},1); render()">Remove</button></div>`).join("")||`<div class="combo-box"><strong>No combined divisions yet.</strong><br/><small>Combined groups will appear here.</small></div>`}
    function feeLadderEditor(){return `<div style="display:grid;gap:8px">${state.feeLadder.map((f,i)=>`<div class="fee-grid"><div class="field"><label>Entry #</label><input data-fee-entry="${i}" value="${f.entry}"/></div><div class="field"><label>Fee</label><input data-fee-amount="${i}" data-currency="true" inputmode="decimal" placeholder="$0.00" value="${f.fee?formatCurrency(f.fee):""}"/></div><button class="mini danger" data-fee-remove="${i}">Remove</button></div>`).join("")||emptyState("No entry fees configured yet.","Use Add fee step to build this tournament’s pricing ladder.")}</div>`}
    function parseCurrency(v){const n=Number(String(v).replace(/[^0-9.-]/g,""));return Number.isFinite(n)?n:0}
    function formatCurrency(v){const n=parseCurrency(v);return n?new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n):""}
    function bindCurrencyFields(){document.querySelectorAll("[data-currency]").forEach(i=>{i.onfocus=e=>{e.target.value=String(e.target.value).replace(/[^0-9.]/g,"")};i.onblur=e=>{e.target.value=formatCurrency(e.target.value)}})}
    function bindFeeEditor(){document.querySelectorAll("[data-fee-entry]").forEach(i=>i.onchange=e=>{state.feeLadder[Number(e.target.dataset.feeEntry)].entry=Number(e.target.value)||1});document.querySelectorAll("[data-fee-amount]").forEach(i=>i.onchange=e=>{state.feeLadder[Number(e.target.dataset.feeAmount)].fee=parseCurrency(e.target.value)});document.querySelectorAll("[data-fee-remove]").forEach(b=>b.onclick=e=>{state.feeLadder.splice(Number(e.target.dataset.feeRemove),1);render()});const add=document.getElementById("addFee");if(add)add.onclick=()=>{const last=state.feeLadder[state.feeLadder.length-1]||{entry:0};state.feeLadder.push({entry:Number(last.entry)+1,fee:0});render()}}
    function divisionLibraryControls(){const libs=state.lookups.divisionLibraries||[];return libs.length?`<div class="library-picks">${libs.map(l=>`<label><input type="checkbox" data-lib="${clean(l.value)}" ${state.librarySelections[l.value]?"checked":""}/> ${clean(l.label||l.value)}</label>`).join("")}</div>`:emptyState("No division libraries loaded yet.","Division library categories should come from the database lookup table, then load their linked division templates automatically.")}
    function refreshDivisionsFromLibraries(){const selected=Object.keys(state.librarySelections).filter(k=>state.librarySelections[k]);const previous=new Map(state.divisions.map(d=>[d.id,d.included]));state.divisions=(state.lookups.divisionTemplates||[]).filter(d=>selected.includes(d.library_id)).map(d=>({...d,included:previous.has(d.id)?previous.get(d.id):true}));render()}
    function divisionTable(){return `<table><thead><tr><th>Include</th><th>Library</th><th>Code</th><th>Division</th><th>Ruleset</th><th>Gender</th><th>Age</th><th>Experience</th><th>Weight</th><th>Price item</th></tr></thead><tbody>${state.divisions.map(d=>`<tr><td><input class="check" type="checkbox" data-div="${clean(d.id)}" ${d.included?"checked":""}></td><td>${clean(d.library||"—")}</td><td><b>${clean(d.id)}</b></td><td>${clean(d.name)}</td><td>${clean(d.ruleset)}</td><td>${clean(d.gender)}</td><td>${clean(d.age)}</td><td>${clean(d.exp)}</td><td>${clean(d.weight)}</td><td>${clean(d.price)}</td></tr>`).join("")||`<tr><td colspan="10">No division templates loaded. Select a division library after lookup tables are loaded.</td></tr>`}</tbody></table>`}
    function importView(){state.view="setup";history.replaceState(null,"","#setup");setup()}
    function importHistoryTable(history){return `<table><thead><tr><th>File</th><th>Source</th><th>Rows read</th><th>New</th><th>Duplicates skipped</th></tr></thead><tbody>${history.map(h=>`<tr><td>${clean(h.file)}</td><td>${clean(h.source)}</td><td>${h.total}</td><td>${h.added}</td><td>${h.duplicates}</td></tr>`).join("")||`<tr><td colspan="5">No CSV files attached to this event yet.</td></tr>`}</tbody></table>`}
    function importTable(rows=currentImports()){return `<table><thead><tr><th>Name</th><th>Type</th><th>Member ID</th><th>Paid</th><th>Division</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${clean(r.name)}</td><td>${clean(r.type)}</td><td>${clean(r.member)}</td><td>${clean(r.paid)}</td><td>${clean(r.division)}</td><td>${pill(clean(r.status),r.kind)}</td><td>${r.kind==="bad"?"Fix first":r.kind==="warn"?"Collect / override":"Approve"}</td></tr>`).join("")||`<tr><td colspan="7">No import file uploaded for this event yet.</td></tr>`}</tbody></table>`}
    function parseCSV(text){const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(Boolean);const parse=line=>{let out=[],cur="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===","){out.push(cur);cur=""}else cur+=c}out.push(cur);return out};const heads=parse(lines[0]||"").map(h=>h.toLowerCase().trim());return lines.slice(1).map(l=>{const cells=parse(l),o={};heads.forEach((h,i)=>o[h]=cells[i]||"");return o})}
    function readCsv(e){const f=e.target.files[0],event=selectedEvent();if(!f||!event)return;const reader=new FileReader();reader.onload=()=>{const parsedRows=parseCSV(reader.result);const incoming=parsedRows.slice(0,500).map(r=>{const name=[r.firstname,r.lastname].filter(Boolean).join(" ")||r.name||r.fullname||"Unnamed";const paid=r.paid==="1"||String(r.paid).toLowerCase()==="yes"?"Yes":"No";const gender=r.gender||"";const member=r.memberid||r.member||"";const kind=!gender?"bad":paid==="No"?"warn":member==="0"?"bad":"ok";const status=!gender?"Gender missing":paid==="No"?"Payment needed":member==="0"?"Member ID invalid":"Ready";const div=Object.keys(r).filter(k=>/^division\\d+$/.test(k)&&r[k]).map(k=>r[k].split(" -- ")[0]).slice(0,3).join(", ")||"—";const type=r.overidepasstype||r.persontype||"Athlete";const key=[event.id,member||name,type,div].join("|").toLowerCase().replace(/\\s+/g," ").trim();return {key,name,type,member,paid,division:div,status,kind,source:state.importSource,file:f.name}});const existing=state.importsByEvent[event.id]||[];const keys=new Set(existing.map(r=>r.key));const newRows=incoming.filter(r=>!keys.has(r.key));state.importsByEvent[event.id]=existing.concat(newRows);state.fileName=f.name;state.lastImport={file:f.name,source:state.importSource,total:incoming.length,added:newRows.length,duplicates:incoming.length-newRows.length};event.lastFileName=f.name;event.lastImport=state.lastImport;event.registrations=String(state.importsByEvent[event.id].length);state.importHistoryByEvent[event.id]=[state.lastImport,...(state.importHistoryByEvent[event.id]||[])];render()};reader.readAsText(f)}
    function checkin(){shell("QR check-in station","Scan QR codes or search manually for athletes, coaches, volunteers, and tickets.",`<div class="grid"><section class="card span5"><div class="phone"><div class="phone-screen"><div class="phone-head"><strong>QR Check-in</strong><span>Athletes · coaches · volunteers · tickets</span></div><div class="search">Scan QR or search name / member ID / dojo…</div>${emptyState("No check-in records loaded.","Uploaded registrations, credentials, and tickets will appear here.")}</div></div></section><section class="card span7"><h2>How QR check-in works</h2>${["Registration/import creates a Tournament360 check-in token.","QR encodes only the token URL — not DOB, payment, or private data.","Staff scans QR and opens the exact registration, credential, or ticket.","System shows blockers: unpaid, missing gender/DOB, invalid member ID, duplicate ticket scan.","Staff verifies identity, issues wristband/redeems ticket, and logs timestamp + staff user."].map((s,i)=>`<div class="row"><span class="pill warn">${i+1}</span><strong style="flex:1">${s}</strong></div>`).join("")}<div class="row"><div><strong>QR URL format</strong><small>rankkeeper.app/t360/checkin/[secure-token]</small></div><div class="qr"></div></div></section></div>`)}
    function staging(){shell("Staging command center","Call divisions, resolve missing competitors, combine small groups, and push to tatami.",`<div class="grid"><section class="card span8"><h2>Ready / waiting divisions</h2>${emptyState("No divisions are in staging.","Checked-in divisions will appear here when they are ready to call or assign.")}</section><section class="card span4"><h2>Call message preview</h2><p>No message queued yet.</p>${row("SMS subscribers","0 numbers","Not ready","warn")}${row("Fee configured","Not set","Editable","warn")}${row("Last sent","Never","—","warn")}<button class="btn gold" style="width:100%;margin-top:14px">Send staging call</button></section></div>`)}
    function bracket(){shell("Operator bracket review","Finished matches show Final Score/Edit. Available matches all say Start this match.",`<section class="card bracket-wrap"><h2>No bracket loaded</h2>${emptyState("No active division bracket.","Once a division is staged and bracketed, the operator will start matches from here.")}</section>`)}
    function scoreSide(side,label,name,dojo,initials,pts){return `<section class="score-side ${side}"><div class="score-label">${label}</div><div class="person"><div class="avatar ${side==='aka'?'red':''}">${initials||"—"}</div><div class="flag">🏳️ <span style="font-size:14px">Country</span></div><h2>${name}</h2><p>${dojo||"No active match loaded"}</p><div class="points">${pts}</div></div><div class="score-btns"><button>Yuko +1</button><button>Waza-ari +2</button><button>Ippon +3</button></div></section>`}
    function scoring(){root.innerHTML=`<div><div class="top" style="height:48px;background:var(--navy);padding:8px 18px;margin:0;color:white"><b>Tournament360 · Operator Scoring</b><div class="actions"><button class="btn ghost" onclick="go('bracket')">Back to bracket</button><button class="btn gold" onclick="state.critical=!state.critical; state.clock=state.critical?'0:04.87':'0:15'; render()">Toggle timer state</button></div></div><div class="score-screen"><div class="timer ${state.critical?'critical':''}"><b>${state.clock}</b><small>${state.critical?'milliseconds visible under 5 sec':'yellow at 15 sec · exact clock · ±1 sec'}</small></div>${scoreSide("ao","AO","Awaiting athlete","","","0")}<div class="score-mid"></div>${scoreSide("aka","AKA","Awaiting athlete","","","0")}</div></div>`}
    function audienceBracket(){root.innerHTML=`<div class="tv"><div class="tv-head"><strong>Tatami</strong><span>No audience bracket loaded</span></div><div style="padding:34px">${emptyState("No bracket is currently assigned to this screen.","When an admin pushes a staged division to this tatami, the audience bracket will display here.")}</div><div class="tv-foot"><span style="color:var(--green)">Green border = current round</span><span style="color:#9a6a0b">Yellow border = up next</span><span>AKA red · AO blue</span></div></div>`}
    function audienceScore(){root.innerHTML=`<div class="tv"><div class="tv-head"><strong>Tatami</strong><span>No active match · ${state.clock}</span></div><div class="score-screen" style="min-height:calc(100dvh - 188px)">${scoreSide("ao","AO","Awaiting athlete","","","0")}<div class="score-mid"></div>${scoreSide("aka","AKA","Awaiting athlete","","","0")}</div><div class="tv-foot"><div><small>Next up</small><div class="nextbar"><span class="nextbox ao">AO · Awaiting athlete</span><span class="nextbox aka">AKA · Awaiting athlete</span></div></div><span>Winner returns to bracket review</span></div></div>`}
    function systemAdmin(){shell("System admin support","EUC² support can look up dojo accounts, view their events, and assist as if signed in to their account.",`<div class="grid"><section class="card span12"><h2>Account lookup</h2><div class="fields"><div class="field"><label>Search dojo, owner, email, event, or tournament ID</label><input value=""/></div><div class="field"><label>Event status</label><select>${lookupOptions("eventStatuses","","No event statuses loaded")}</select></div><div class="field"><label>Event type</label><select>${lookupOptions("eventTypes","","No event types loaded")}</select></div></div></section><section class="card span8"><h2>Managed events</h2>${emptyState("No account selected.","Search results will show dojo accounts and events here. Support actions should be logged for audit.")}</section><section class="card span4"><h2>Remote support tools</h2>${row("Impersonation mode","Open event as support user","Audit required","warn")}${row("Billing support","Verify event activation status","Read only","ok")}${row("Event health","Check imports, staging, rings, and pending approvals","Available","ok")}<button class="btn gold" style="width:100%;margin-top:14px">Open selected account as support</button></section></div>`)}
    function render(){({dashboard,setup,import:importView,checkin,staging,bracket,scoring,"audience-bracket":audienceBracket,"audience-score":audienceScore,"system-admin":systemAdmin}[state.view]||dashboard)()}
    window.go=go;window.state=state;window.openEvent=openEvent;window.newEventDraft=newEventDraft;window.render=render;window.addEventListener("hashchange",()=>{state.view=location.hash.slice(1)||"dashboard";render()});render();
  </script>
</body>
