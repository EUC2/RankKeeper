<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tournament360 · Phase 1</title>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <style>
    :root{--paper:#f5f0e8;--card:#fffaf0;--ink:#1e211d;--muted:#746a5b;--line:#d8ccb7;--navy:#071f46;--gold:#d7ad37;--red:#b91c2a;--blue:#1048b5;--green:#1f8f52;--green2:#19b86a;--warn:#fff1c4;--bad:#ffe1df;--black:#05070c;--white:#f8f6f0}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}
    .app{display:grid;grid-template-columns:250px 1fr;min-height:100dvh}.side{background:var(--navy);color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;gap:11px;align-items:center}.mark{width:46px;height:46px;border-radius:14px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:1000}.brand b{font-size:20px}.brand span{display:block;color:#c3cede;font-size:12px}.nav{display:grid;gap:8px}.nav button{border:0;text-align:left;background:transparent;color:#d6deeb;border-radius:12px;padding:11px 12px;font-weight:850}.nav button.on{background:rgba(215,173,55,.18);color:var(--gold)}.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.16);padding-top:14px;color:#b9c6d8;font-size:12px;line-height:1.4}
    .main{padding:24px 30px 34px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.top h1{margin:0;color:var(--navy);font-size:32px;letter-spacing:-.035em}.top p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;background:var(--navy);color:var(--gold);font-weight:950;padding:10px 13px}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}
    .view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 12px 30px rgba(7,31,70,.07)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.card h2{margin:0 0 10px;color:var(--navy);font-size:20px}.card p{color:var(--muted);line-height:1.45}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:950}.metric b{display:block;color:var(--navy);font-size:42px;letter-spacing:-.05em;margin-top:6px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e4d8c5;background:#f8f2e7;border-radius:14px;padding:12px;margin-top:9px}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:2px}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950;background:#e3f5e9;color:#1d6a3b;white-space:nowrap}.pill.warn{background:var(--warn);color:#82610d}.pill.bad{background:var(--bad);color:#9f2929}.pill.blue{background:#dbeafe;color:var(--blue)}.pill.red{background:#fee2e2;color:var(--red)}.pill.dark{background:#111827;color:#fff}
    table{width:100%;border-collapse:separate;border-spacing:0 8px}th{text-align:left;color:#756b5b;text-transform:uppercase;letter-spacing:.1em;font-size:10px;padding:0 8px}td{background:#f8f2e7;border-top:1px solid #e4d8c5;border-bottom:1px solid #e4d8c5;padding:10px 8px;font-size:13px}td:first-child{border-left:1px solid #e4d8c5;border-radius:12px 0 0 12px}td:last-child{border-right:1px solid #e4d8c5;border-radius:0 12px 12px 0}.check{width:18px;height:18px;accent-color:var(--navy)}.mini{border:0;border-radius:10px;background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:900;padding:7px 9px}.mini.danger{color:var(--red)}.fee-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.fee-grid .field input{padding:8px}.combo-box{border:1px solid #dfd2bd;background:#f8f2e7;border-radius:14px;padding:11px;margin-top:9px}.combo-box strong{color:var(--navy)}
    .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;color:#8a7350;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;margin-bottom:5px}.field input,.field select{width:100%;background:#f8f2e7;border:1px solid #dfd2bd;border-radius:12px;padding:10px;font-weight:800;color:#2a241c}.upload{border:2px dashed #ceb987;background:#fff9ea;border-radius:16px;padding:18px;display:grid;gap:8px}.upload input{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}
    .phone{max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:32px;padding:14px;margin:auto}.phone-screen{background:#f7f1e6;border-radius:24px;overflow:hidden;min-height:620px}.phone-head{background:var(--navy);color:#fff;padding:17px}.phone-head strong{font-size:22px}.phone-head span{display:block;color:#cdd8ea;font-size:12px}.search{margin:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--muted)}.qr{width:88px;height:88px;border-radius:10px;background:linear-gradient(90deg,#111 10px,transparent 10px 16px,#111 16px 24px,transparent 24px 34px,#111 34px 44px,transparent 44px),linear-gradient(#111 10px,transparent 10px 16px,#111 16px 24px,transparent 24px 34px,#111 34px 44px,transparent 44px),#fff;background-size:44px 44px;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
    .bracket{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:980px}.bracket-wrap{overflow:auto}.bcol{display:grid;gap:10px;align-content:start}.btitle{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#756b5b;font-weight:950}.match{background:#f8f2e7;border:1px solid #ddd0bb;border-radius:16px;overflow:hidden}.match.current{outline:5px solid var(--gold)}.match.available{outline:4px solid var(--green2)}.fighter{display:grid;grid-template-columns:64px 1fr;align-items:center;border-bottom:1px solid #e1d6c4}.fighter:last-child{border-bottom:0}.corner{height:68px;display:grid;place-items:center;color:#fff;font-weight:1000}.corner.ao{background:var(--blue)}.corner.aka{background:var(--red)}.corner.shiro{background:var(--white);color:#111;border-right:1px solid var(--line)}.fname{padding:10px;font-weight:900}.fname small{display:block;color:var(--muted);font-weight:650;margin-top:2px}.start{width:100%;border:0;background:var(--navy);color:var(--gold);padding:11px;font-weight:950}.donebar{display:grid;grid-template-columns:1fr 1fr}.donebar button{border:0;padding:10px;font-weight:950}.donebar button:first-child{background:#e8f6ed;color:var(--green)}.donebar button:last-child{background:#fee2e2;color:var(--red)}
    .score-screen{background:var(--black);min-height:calc(100dvh - 48px);display:grid;grid-template-columns:1fr 220px 1fr;position:relative}.score-side{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:24px;color:#fff}.score-side.ao{background:var(--blue)}.score-side.aka{background:var(--red)}.score-side.shiro{background:var(--white);color:#111}.score-label{font-size:34px;font-weight:1000}.person{text-align:center;align-self:center}.avatar{width:140px;height:140px;border-radius:50%;background:#d8e7ff;color:var(--navy);display:grid;place-items:center;font-size:46px;font-weight:1000;margin:0 auto 10px;border:4px solid #fff}.avatar.red{background:#ffd8d8}.flag{font-size:24px}.person h2{font-size:40px;color:inherit;margin:8px 0}.person p{color:inherit;opacity:.78;font-size:20px}.points{font-size:150px;line-height:.85;font-weight:1000;margin-top:30px}.score-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score-btns button{border:0;border-radius:14px;background:rgba(255,255,255,.2);color:inherit;padding:16px 8px;font-weight:950}.timer{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:560px;max-width:42vw;border-radius:32px;text-align:center;border:6px solid var(--gold);background:var(--warn);color:var(--navy);padding:8px 18px;z-index:4}.timer b{display:block;font-size:132px;line-height:.92}.timer small{display:block;font-weight:950}.timer.critical{background:#fff;color:var(--red);border-color:#fff}.score-mid{background:#05070c}
    .tv{background:#05070c;color:#fff;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.tv-head{background:var(--navy);border-bottom:6px solid var(--gold);padding:22px 34px;display:flex;justify-content:space-between}.tv-head strong{font-size:44px}.tv-head span{font-size:24px;color:#d9e2f1}.tv .bracket{min-width:1120px;padding:32px}.tv .btitle{color:#f0d47a;font-size:16px}.tv .match{background:#101827;border-color:#2f3b50}.tv .fname{color:#fff;font-size:22px}.tv .fname small{color:#b7c1d0;font-size:14px}.tv-foot{background:#fffaf0;color:var(--navy);padding:14px 34px;display:flex;justify-content:space-between;font-size:24px;font-weight:1000}.nextbar{display:flex;gap:14px}.nextbox{padding:8px 18px;color:#fff;font-weight:1000}.nextbox.ao{background:var(--blue)}.nextbox.aka{background:var(--red)}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(2,1fr)}.span3,.span4,.span5,.span6,.span7,.span8,.span12{grid-column:span 12}.fields{grid-template-columns:1fr}.score-screen{grid-template-columns:1fr}.score-mid{display:none}.timer{position:static;transform:none;max-width:none;width:auto;margin:12px}.tv-head,.tv-foot{display:block}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const divisions=[];
    let state={view:location.hash.slice(1)||"dashboard",divisions,imported:[],fileName:"No file selected",clock:"0:00",critical:false,ruleset:"NKF",importSource:"Tournament in a Box",combineFrom:"",combineTo:"",feeLadder:[],combined:[]};
    const nav=["dashboard","setup","import","checkin","staging","bracket","scoring","audience-bracket","audience-score"];
    const labels={"dashboard":"Dashboard","setup":"Setup","import":"CSV Import","checkin":"QR Check-in","staging":"Staging","bracket":"Ring Bracket","scoring":"Scoring","audience-bracket":"Audience Bracket","audience-score":"Audience Score"};
    const root=document.getElementById("root");
    const pill=(s,k="ok")=>`<span class="pill ${k}">${s}</span>`;
    const emptyState=(title,body)=>`<div class="row" style="display:block"><strong>${title}</strong><small>${body}</small></div>`;
    function shell(title,sub,content,actions=""){
      root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="mark">T360</div><div><b>Tournament360</b><span>Phase 1 build</span></div></div><div class="nav">${nav.map(v=>`<button class="${state.view===v?'on':''}" data-nav="${v}">${labels[v]}</button>`).join("")}</div><div class="side-foot">No tournament loaded yet.<br/><br/>Local prototype mode. No live data writes yet.</div></aside><main class="main"><div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>${content}</main></div>`;
      document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
    }
    function go(v){state.view=v;history.replaceState(null,"","#"+v);render()}
    function metric(a,b,c){return `<section class="card metric span3"><span>${a}</span><b>${b}</b><p>${c}</p></section>`}
    function row(a,b,c,k="ok"){return `<div class="row"><div><strong>${a}</strong><small>${b}</small></div>${pill(c,k)}</div>`}
    function dashboard(){shell("Admin command center","Live tournament health, staging readiness, ring status, and pending approval.",`<div class="grid">${metric("Registrations","0","No registrations loaded")}${metric("Checked in","0","No check-ins yet")}${metric("Staged","0","No divisions staged")}${metric("Rings live","0","No tatami sessions active")}<section class="card span7"><h2>Division readiness</h2>${emptyState("No divisions are ready yet.","Upload registration data or add divisions before staging.")}</section><section class="card span5"><h2>Pending admin approval</h2>${emptyState("No ring results pending approval.","Completed divisions will appear here after ring operators submit final results.")}</section></div>`)}
    function setup(){
      shell("Tournament setup","Configure event items, fees, rulesets, CSV imports, spectator tickets, division tables, and division-combine rules.",`<div class="grid"><section class="card span8"><h2>Event settings</h2><div class="fields">${field("Event type","")}${field("Ruleset",state.ruleset,"select")}${field("Competition date","")}${field("SMS fee","")}${field("Spectator ticket","")}${field("Bracket warning","Warn if fewer than 3")}</div></section><section class="card span4"><h2>Entry fee ladder</h2><p>Edit per tournament. Fourth row can mean “4th and every additional entry.”</p>${feeLadderEditor()}<button class="btn gold" id="addFee" style="width:100%;margin-top:10px">Add fee step</button></section><section class="card span12"><h2>Combine divisions</h2><p>When a division is too small, combine it into another division before bracket generation. Tournament360 keeps the original registration division for audit/export.</p><div class="fields"><div class="field"><label>Move athletes from</label>${divisionSelect("combineFrom",state.combineFrom)}</div><div class="field"><label>Combine into</label>${divisionSelect("combineTo",state.combineTo)}</div><div class="field"><label>Reason / note</label><input id="combineNote" value=""/></div></div><button class="btn" id="combineBtn" style="margin-top:12px">Combine selected divisions</button><div id="combinedList">${combinedList()}</div></section><section class="card span12"><h2>Division library selection</h2><p>Long checkbox table. This can scale to hundreds of divisions from lookup tables.</p>${divisionTable()}</section></div>`);
      document.querySelectorAll("[data-div]").forEach(c=>c.onchange=e=>{const d=state.divisions.find(x=>x.id===e.target.dataset.div);if(d)d.included=e.target.checked;render()});
      const rules=document.getElementById("Ruleset");if(rules)rules.onchange=e=>{state.ruleset=e.target.value;render()};
      bindFeeEditor();
      const from=document.getElementById("combineFrom"),to=document.getElementById("combineTo");
      if(from)from.onchange=e=>state.combineFrom=e.target.value;
      if(to)to.onchange=e=>state.combineTo=e.target.value;
      const addCombo=document.getElementById("combineBtn");if(addCombo)addCombo.onclick=()=>{const f=state.divisions.find(d=>d.id===state.combineFrom),t=state.divisions.find(d=>d.id===state.combineTo);if(!f||!t||f.id===t.id)return;state.combined.unshift({from:`${f.id} · ${f.name}`,to:`${t.id} · ${t.name}`,note:document.getElementById("combineNote").value||"Director approved"});render()};
    }
    function field(label,value,type="input"){return `<div class="field"><label for="${label}">${label}</label>${type==="select"?`<select id="${label}"><option ${value==="NKF"?"selected":""}>NKF</option><option ${value==="AAU"?"selected":""}>AAU</option><option ${value==="WKF"?"selected":""}>WKF</option></select>`:`<input id="${label}" value="${value}"/>`}</div>`}
    function divisionSelect(id,value){const options=state.divisions.filter(d=>["NKF","AAU","WKF"].includes(d.ruleset));return `<select id="${id}"><option value="">No divisions loaded</option>${options.map(d=>`<option value="${d.id}" ${d.id===value?"selected":""}>${d.id} · ${d.name}</option>`).join("")}</select>`}
    function combinedList(){return state.combined.map((c,i)=>`<div class="combo-box"><strong>${c.from}</strong> → <strong>${c.to}</strong><br/><small>${c.note}</small> <button class="mini danger" style="float:right" onclick="state.combined.splice(${i},1); render()">Remove</button></div>`).join("")||`<div class="combo-box"><strong>No combined divisions yet.</strong><br/><small>Combined groups will appear here.</small></div>`}
    function feeLadderEditor(){return `<div style="display:grid;gap:8px">${state.feeLadder.map((f,i)=>`<div class="fee-grid"><div class="field"><label>Entry #</label><input data-fee-entry="${i}" value="${f.entry}"/></div><div class="field"><label>Fee</label><input data-fee-amount="${i}" value="${f.fee?`$${f.fee}`:""}"/></div><button class="mini danger" data-fee-remove="${i}">Remove</button></div>`).join("")||emptyState("No entry fees configured yet.","Use Add fee step to build this tournament’s pricing ladder.")}</div>`}
    function bindFeeEditor(){document.querySelectorAll("[data-fee-entry]").forEach(i=>i.onchange=e=>{state.feeLadder[Number(e.target.dataset.feeEntry)].entry=Number(e.target.value)||1});document.querySelectorAll("[data-fee-amount]").forEach(i=>i.onchange=e=>{state.feeLadder[Number(e.target.dataset.feeAmount)].fee=Number(String(e.target.value).replace(/[^0-9.]/g,""))||0});document.querySelectorAll("[data-fee-remove]").forEach(b=>b.onclick=e=>{state.feeLadder.splice(Number(e.target.dataset.feeRemove),1);render()});const add=document.getElementById("addFee");if(add)add.onclick=()=>{const last=state.feeLadder[state.feeLadder.length-1]||{entry:0};state.feeLadder.push({entry:Number(last.entry)+1,fee:0});render()}}
    function divisionTable(){return `<table><thead><tr><th>Include</th><th>Code</th><th>Division</th><th>Ruleset</th><th>Gender</th><th>Age</th><th>Experience</th><th>Weight</th><th>Price item</th></tr></thead><tbody>${state.divisions.map(d=>`<tr><td><input class="check" type="checkbox" data-div="${d.id}" ${d.included?"checked":""}></td><td><b>${d.id}</b></td><td>${d.name}</td><td>${d.ruleset}</td><td>${d.gender}</td><td>${d.age}</td><td>${d.exp}</td><td>${d.weight}</td><td>${d.price}</td></tr>`).join("")||`<tr><td colspan="9">No division templates loaded yet.</td></tr>`}</tbody></table>`}
    function importView(){shell("Import review","Choose the source system, upload a .csv file, map fields, then validate before check-in or brackets.",`<div class="grid"><section class="card span4"><h2>Upload .CSV file</h2><div class="field"><label>Source system</label><select id="importSource"><option ${state.importSource==="Tournament in a Box"?"selected":""}>Tournament in a Box</option><option ${state.importSource==="Sportdata"?"selected":""}>Sportdata</option><option ${state.importSource==="Sports Data Technologies"?"selected":""}>Sports Data Technologies</option><option ${state.importSource==="Tournament360"?"selected":""}>Tournament360</option><option ${state.importSource==="Generic CSV"?"selected":""}>Generic CSV</option></select></div><div class="upload" style="margin-top:12px"><input type="file" id="csv" accept=".csv,text/csv"/><strong>${state.fileName}</strong><small>Using ${state.importSource} field map. Phase 1 parses the header/rows locally and creates an import preview.</small></div></section>${metric("Rows",state.imported.length,"in preview")}${metric("Clean",state.imported.filter(r=>r.kind==='ok').length,"ready")}${metric("Warnings",state.imported.filter(r=>r.kind==='warn').length,"review")}<section class="card span12"><h2>Validation queue</h2>${importTable()}</section></div>`);document.getElementById("csv").onchange=readCsv;document.getElementById("importSource").onchange=e=>{state.importSource=e.target.value;render()}}
    function importTable(){return `<table><thead><tr><th>Name</th><th>Type</th><th>Member ID</th><th>Paid</th><th>Division</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.imported.map(r=>`<tr><td>${r.name}</td><td>${r.type}</td><td>${r.member}</td><td>${r.paid}</td><td>${r.division}</td><td>${pill(r.status,r.kind)}</td><td>${r.kind==="bad"?"Fix first":r.kind==="warn"?"Collect / override":"Approve"}</td></tr>`).join("")||`<tr><td colspan="7">No import file uploaded yet.</td></tr>`}</tbody></table>`}
    function parseCSV(text){const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(Boolean);const parse=line=>{let out=[],cur="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===","){out.push(cur);cur=""}else cur+=c}out.push(cur);return out};const heads=parse(lines[0]||"").map(h=>h.toLowerCase().trim());return lines.slice(1).map(l=>{const cells=parse(l),o={};heads.forEach((h,i)=>o[h]=cells[i]||"");return o})}
    function readCsv(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const rows=parseCSV(reader.result);state.fileName=f.name;state.imported=rows.slice(0,50).map(r=>{const name=[r.firstname,r.lastname].filter(Boolean).join(" ")||r.name||r.fullname||"Unnamed";const paid=r.paid==="1"||String(r.paid).toLowerCase()==="yes"?"Yes":"No";const gender=r.gender||"";const member=r.memberid||r.member||"";const kind=!gender?"bad":paid==="No"?"warn":member==="0"?"bad":"ok";const status=!gender?"Gender missing":paid==="No"?"Payment needed":member==="0"?"Member ID invalid":"Ready";const div=Object.keys(r).filter(k=>/^division\\d+$/.test(k)&&r[k]).map(k=>r[k].split(" -- ")[0]).slice(0,3).join(", ")||"—";return {name,type:r.overidepasstype||r.persontype||"Athlete",member,paid,division:div,status,kind}});render()};reader.readAsText(f)}
    function checkin(){shell("QR check-in station","Scan QR codes or search manually for athletes, coaches, volunteers, and tickets.",`<div class="grid"><section class="card span5"><div class="phone"><div class="phone-screen"><div class="phone-head"><strong>QR Check-in</strong><span>Athletes · coaches · volunteers · tickets</span></div><div class="search">Scan QR or search name / member ID / dojo…</div>${emptyState("No check-in records loaded.","Uploaded registrations, credentials, and tickets will appear here.")}</div></div></section><section class="card span7"><h2>How QR check-in works</h2>${["Registration/import creates a Tournament360 check-in token.","QR encodes only the token URL — not DOB, payment, or private data.","Staff scans QR and opens the exact registration, credential, or ticket.","System shows blockers: unpaid, missing gender/DOB, invalid member ID, duplicate ticket scan.","Staff verifies identity, issues wristband/redeems ticket, and logs timestamp + staff user."].map((s,i)=>`<div class="row"><span class="pill warn">${i+1}</span><strong style="flex:1">${s}</strong></div>`).join("")}<div class="row"><div><strong>QR URL format</strong><small>rankkeeper.app/t360/checkin/[secure-token]</small></div><div class="qr"></div></div></section></div>`)}
    function staging(){shell("Staging command center","Call divisions, resolve missing competitors, combine small groups, and push to tatami.",`<div class="grid"><section class="card span8"><h2>Ready / waiting divisions</h2>${emptyState("No divisions are in staging.","Checked-in divisions will appear here when they are ready to call or assign.")}</section><section class="card span4"><h2>Call message preview</h2><p>No message queued yet.</p>${row("SMS subscribers","0 numbers","Not ready","warn")}${row("Fee configured","Not set","Editable","warn")}${row("Last sent","Never","—","warn")}<button class="btn gold" style="width:100%;margin-top:14px">Send staging call</button></section></div>`)}
    function bracket(){shell("Operator bracket review","Finished matches show Final Score/Edit. Available matches all say Start this match.",`<section class="card bracket-wrap"><h2>No bracket loaded</h2>${emptyState("No active division bracket.","Once a division is staged and bracketed, the operator will start matches from here.")}</section>`)}
    function scoreSide(side,label,name,dojo,initials,pts){return `<section class="score-side ${side}"><div class="score-label">${label}</div><div class="person"><div class="avatar ${side==='aka'?'red':''}">${initials||"—"}</div><div class="flag">🏳️ <span style="font-size:14px">Country</span></div><h2>${name}</h2><p>${dojo||"No active match loaded"}</p><div class="points">${pts}</div></div><div class="score-btns"><button>Yuko +1</button><button>Waza-ari +2</button><button>Ippon +3</button></div></section>`}
    function scoring(){root.innerHTML=`<div><div class="top" style="height:48px;background:var(--navy);padding:8px 18px;margin:0;color:white"><b>Tournament360 · Operator Scoring</b><div class="actions"><button class="btn ghost" onclick="go('bracket')">Back to bracket</button><button class="btn gold" onclick="state.critical=!state.critical; state.clock=state.critical?'0:04.87':'0:15'; render()">Toggle timer state</button></div></div><div class="score-screen"><div class="timer ${state.critical?'critical':''}"><b>${state.clock}</b><small>${state.critical?'milliseconds visible under 5 sec':'yellow at 15 sec · exact clock · ±1 sec'}</small></div>${scoreSide("ao","AO","Awaiting athlete","","","0")}<div class="score-mid"></div>${scoreSide("aka","AKA","Awaiting athlete","","","0")}</div></div>`}
    function audienceBracket(){root.innerHTML=`<div class="tv"><div class="tv-head"><strong>Tatami</strong><span>No audience bracket loaded</span></div><div style="padding:34px">${emptyState("No bracket is currently assigned to this screen.","When an admin pushes a staged division to this tatami, the audience bracket will display here.")}</div><div class="tv-foot"><span style="color:var(--green)">Green border = current round</span><span style="color:#9a6a0b">Yellow border = up next</span><span>AKA red · AO blue</span></div></div>`}
    function audienceScore(){root.innerHTML=`<div class="tv"><div class="tv-head"><strong>Tatami</strong><span>No active match · ${state.clock}</span></div><div class="score-screen" style="min-height:calc(100dvh - 188px)">${scoreSide("ao","AO","Awaiting athlete","","","0")}<div class="score-mid"></div>${scoreSide("aka","AKA","Awaiting athlete","","","0")}</div><div class="tv-foot"><div><small>Next up</small><div class="nextbar"><span class="nextbox ao">AO · Awaiting athlete</span><span class="nextbox aka">AKA · Awaiting athlete</span></div></div><span>Winner returns to bracket review</span></div></div>`}
    function render(){({dashboard,setup,import:importView,checkin,staging,bracket,scoring,"audience-bracket":audienceBracket,"audience-score":audienceScore}[state.view]||dashboard)()}
    window.go=go;window.state=state;window.addEventListener("hashchange",()=>{state.view=location.hash.slice(1)||"dashboard";render()});render();
  </script>
</body>
</html>
